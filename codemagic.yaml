workflows:
  android-aab:
    name: Android AAB Release
    max_build_duration: 60

    environment:
      node: 20
      vars:
        PROJECT_DIR: mobile
        EXPO_PUBLIC_API_URL: https://api.alzakwaantours.com/api

    scripts:
      - name: Install dependencies
        script: |
          cd $PROJECT_DIR
          npm install

      - name: Prebuild native Android project
        script: |
          cd $PROJECT_DIR
          npx expo prebuild --platform android --non-interactive

      - name: Setup release signing
        script: |
          KEYSTORE_PATH="/tmp/umrah-release.jks"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias umrah \
            -dname "CN=Umrah Companion, OU=AlZakwaan, O=AlZakwaan Tours, L=Aligarh, S=UP, C=IN" \
            -storepass umrah123 \
            -keypass umrah123 -noprompt
          echo "MYAPP_UPLOAD_STORE_FILE=$KEYSTORE_PATH" >> "$PROJECT_DIR/android/gradle.properties"
          echo "MYAPP_UPLOAD_KEY_ALIAS=umrah" >> "$PROJECT_DIR/android/gradle.properties"
          echo "MYAPP_UPLOAD_STORE_PASSWORD=umrah123" >> "$PROJECT_DIR/android/gradle.properties"
          echo "MYAPP_UPLOAD_KEY_PASSWORD=umrah123" >> "$PROJECT_DIR/android/gradle.properties"
          PY=/tmp/patch.py
          echo 'import re, os' > $PY
          echo "gp = os.path.join(os.environ.get('PROJECT_DIR','mobile'),'android/app/build.gradle')" >> $PY
          echo "c = open(gp).read()" >> $PY
          echo "sb = '\n    signingConfigs {\n        release {\n            storeFile file(MYAPP_UPLOAD_STORE_FILE)\n            storePassword MYAPP_UPLOAD_STORE_PASSWORD\n            keyAlias MYAPP_UPLOAD_KEY_ALIAS\n            keyPassword MYAPP_UPLOAD_KEY_PASSWORD\n        }\n    }\n'" >> $PY
          echo "c = re.sub(r'(\s+buildTypes\s*\{)', sb + r'\1', c, count=1)" >> $PY
          echo "c = re.sub(r'(release\s*\{[^}]*?)signingConfig\s+signingConfigs\.debug', r'\1signingConfig signingConfigs.release', c, count=1, flags=re.DOTALL)" >> $PY
          echo "open(gp,'w').write(c)" >> $PY
          echo "print('Patched OK')" >> $PY
          python3 $PY

      - name: Build release AAB
        script: |
          cd $PROJECT_DIR/android
          chmod +x ./gradlew
          ./gradlew bundleRelease

    artifacts:
      - mobile/android/app/build/outputs/bundle/release/*.aab
      - /tmp/umrah-release.jks
