workflows:
  android-apk:
    name: Android APK (Expo prebuild + Gradle)
    max_build_duration: 60
    environment:
      node: 20
      vars:
        PROJECT_DIR: mobile
    scripts:
      - name: Install dependencies
        script: |
          cd $PROJECT_DIR
          npm install
      - name: Prebuild native Android project
        script: |
          cd $PROJECT_DIR
          npx expo prebuild --platform android --non-interactive
      - name: Build debug APK
        script: |
          cd $PROJECT_DIR/android
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - mobile/android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - danishahm89@gmail.com
        notify:
          success: true
          failure: true
