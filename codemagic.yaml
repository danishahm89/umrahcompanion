workflows:
  android-aab:
    name: Android AAB Release
    max_build_duration: 60

    environment:
      node: 20
      vars:
        PROJECT_DIR: mobile
        EXPO_PUBLIC_API_URL: https://api.alzakwaantours.com/api

    scripts:
      - name: Install dependencies
        script: |
          cd $PROJECT_DIR
          npm install

      - name: Prebuild native Android project
        script: |
          cd $PROJECT_DIR
          npx expo prebuild --platform android --non-interactive

      - name: Setup release signing
        script: |
          KEYSTORE_PATH="/tmp/umrah-release.jks"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias umrah \
            -dname "CN=Umrah Companion, OU=AlZakwaan, O=AlZakwaan Tours, L=Aligarh, S=UP, C=IN" \
            -storepass umrah123 \
            -keypass umrah123 -noprompt
          echo "MYAPP_UPLOAD_STORE_FILE=$KEYSTORE_PATH" >> "$PROJECT_DIR/android/gradle.properties"
          echo "MYAPP_UPLOAD_KEY_ALIAS=umrah" >> "$PROJECT_DIR/android/gradle.properties"
          echo "MYAPP_UPLOAD_STORE_PASSWORD=umrah123" >> "$PROJECT_DIR/android/gradle.properties"
          echo "MYAPP_UPLOAD_KEY_PASSWORD=umrah123" >> "$PROJECT_DIR/android/gradle.properties"
          python3 - << 'PYEOF'
import re, os
path = os.path.join(os.environ['PROJECT_DIR'], 'android/app/build.gradle')
with open(path) as f:
    content = f.read()
signing_block = """
    signingConfigs {
        release {
            storeFile file(MYAPP_UPLOAD_STORE_FILE)
            storePassword MYAPP_UPLOAD_STORE_PASSWORD
            keyAlias MYAPP_UPLOAD_KEY_ALIAS
            keyPassword MYAPP_UPLOAD_KEY_PASSWORD
        }
    }
"""
content = re.sub(r'(\s+buildTypes\s*\{)', signing_block + r'\1', content, count=1)
content = re.sub(
    r'(release\s*\{[^}]*?)signingConfig\s+signingConfigs\.debug',
    r'\1signingConfig signingConfigs.release',
    content, count=1, flags=re.DOTALL
)
with open(path, 'w') as f:
    f.write(content)
print('build.gradle patched OK')
PYEOF

      - name: Build release AAB
        script: |
          cd $PROJECT_DIR/android
          chmod +x ./gradlew
          ./gradlew bundleRelease

    artifacts:
      - mobile/android/app/build/outputs/bundle/release/*.aab
      - /tmp/umrah-release.jks
